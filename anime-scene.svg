<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150b35"/>
      <stop offset="0.55" stop-color="#5b2a86"/>
      <stop offset="1" stop-color="#ff7eb3"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .star { animation: twinkle 3s ease-in-out infinite; }
    .win  { animation: blink 4s steps(1) infinite; }
    .petal { animation: fall 9s linear infinite; }
    .scarf { animation: sway 2.2s ease-in-out infinite; }
    .screen { animation: pulse 2.5s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .15 } }
    @keyframes fall {
      0%   { transform: translate(0,-30px); opacity: 0 }
      10%  { opacity: .9 }
      100% { transform: translate(-90px,340px); opacity: 0 }
    }
    @keyframes sway { 0%,100% { transform: translateY(0) } 50% { transform: translateY(3px) } }
    @keyframes pulse { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
  </style>

  <rect width="800" height="300" fill="url(#sky)"/>

  <!-- moon -->
  <circle cx="640" cy="82" r="75" fill="url(#glow)"/>
  <circle cx="640" cy="82" r="38" fill="#fff3d6"/>
  <circle cx="628" cy="72" r="6" fill="#f3e2bd"/>
  <circle cx="652" cy="94" r="4" fill="#f3e2bd"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="star" cx="60"  cy="40" r="1.6"/>
    <circle class="star" cx="140" cy="90" r="1.2" style="animation-delay:.6s"/>
    <circle class="star" cx="230" cy="30" r="1.8" style="animation-delay:1.2s"/>
    <circle class="star" cx="320" cy="75" r="1.2" style="animation-delay:.3s"/>
    <circle class="star" cx="410" cy="35" r="1.6" style="animation-delay:1.8s"/>
    <circle class="star" cx="500" cy="95" r="1.2" style="animation-delay:.9s"/>
    <circle class="star" cx="560" cy="28" r="1.6" style="animation-delay:2.1s"/>
    <circle class="star" cx="730" cy="48" r="1.8" style="animation-delay:1.5s"/>
    <circle class="star" cx="765" cy="120" r="1.2" style="animation-delay:.2s"/>
    <circle class="star" cx="90"  cy="130" r="1.4" style="animation-delay:2.4s"/>
  </g>

  <!-- far skyline -->
  <g fill="#2a1b4d">
    <rect x="0"   y="170" width="60" height="130"/>
    <rect x="60"  y="145" width="45" height="155"/>
    <rect x="105" y="185" width="70" height="115"/>
    <rect x="175" y="160" width="50" height="140"/>
    <rect x="300" y="175" width="60" height="125"/>
    <rect x="360" y="140" width="40" height="160"/>
    <rect x="400" y="180" width="80" height="120"/>
    <rect x="480" y="155" width="55" height="145"/>
    <rect x="535" y="190" width="70" height="110"/>
    <rect x="605" y="165" width="50" height="135"/>
    <rect x="655" y="185" width="80" height="115"/>
    <rect x="735" y="150" width="65" height="150"/>
  </g>

  <!-- windows -->
  <g fill="#ffd98a">
    <rect class="win" x="70"  y="160" width="5" height="7"/>
    <rect class="win" x="85"  y="180" width="5" height="7" style="animation-delay:1s"/>
    <rect class="win" x="188" y="175" width="5" height="7" style="animation-delay:2s"/>
    <rect class="win" x="372" y="155" width="5" height="7" style="animation-delay:.5s"/>
    <rect class="win" x="380" y="175" width="5" height="7" style="animation-delay:3s"/>
    <rect class="win" x="495" y="172" width="5" height="7" style="animation-delay:1.5s"/>
    <rect class="win" x="618" y="182" width="5" height="7" style="animation-delay:2.5s"/>
    <rect class="win" x="750" y="168" width="5" height="7" style="animation-delay:.8s"/>
    <rect class="win" x="765" y="190" width="5" height="7" style="animation-delay:3.4s"/>
  </g>

  <!-- near skyline -->
  <g fill="#150d2e">
    <rect x="250" y="205" width="55" height="95"/>
    <rect x="445" y="215" width="60" height="85"/>
    <rect x="690" y="210" width="60" height="90"/>
  </g>

  <!-- rooftop -->
  <rect x="0" y="252" width="800" height="48" fill="#0d0720"/>
  <rect x="0" y="248" width="800" height="5" fill="#1b1040"/>

  <!-- character (sitting, facing the city) -->
  <g fill="#0d0720">
    <path d="M182 252 Q184 222 200 220 Q216 222 218 252 Z"/>
    <circle cx="200" cy="205" r="15"/>
    <path d="M184 203 L188 184 L194 196 L200 180 L206 196 L212 184 L216 203 Z"/>
    <g class="scarf">
      <path d="M208 218 L252 222 L248 232 L210 227 Z" fill="#ff5c8a"/>
    </g>
    <rect x="216" y="241" width="40" height="5" rx="2"/>
  </g>
  <!-- laptop glow -->
  <rect class="screen" x="226" y="224" width="26" height="17" rx="2" fill="#7dd3fc"/>

  <!-- sakura petals -->
  <g fill="#ffc4dc">
    <ellipse class="petal" cx="760" cy="0" rx="4" ry="2.5" style="animation-delay:0s"/>
    <ellipse class="petal" cx="690" cy="0" rx="3.5" ry="2" style="animation-delay:1.8s"/>
    <ellipse class="petal" cx="610" cy="0" rx="4" ry="2.5" style="animation-delay:3.6s"/>
    <ellipse class="petal" cx="540" cy="0" rx="3" ry="2" style="animation-delay:5.2s"/>
    <ellipse class="petal" cx="470" cy="0" rx="4" ry="2.5" style="animation-delay:2.6s"/>
    <ellipse class="petal" cx="390" cy="0" rx="3.5" ry="2" style="animation-delay:6.4s"/>
    <ellipse class="petal" cx="320" cy="0" rx="4" ry="2.5" style="animation-delay:4.4s"/>
    <ellipse class="petal" cx="720" cy="0" rx="3" ry="2" style="animation-delay:7.4s"/>
  </g>
</svg>
